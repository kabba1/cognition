# The same behavior in different TOML order and whitespace.
config_schema_version=1
[logging]
level='DEBUG'
[sandbox]
enabled=true
[workspace]
root='D:/other-machine/workspace'
[retention]
context_snapshot_days=7
default_payload_days=30
[attention]
heartbeat_backoff_factor=2
heartbeat_max_seconds=3600
heartbeat_min_seconds=60
context_budget_tokens=8192
[model]
reasoning_effort='medium'
max_output_tokens=1024
requested_model='test-model'
adapter='scripted'
[runtime]
poll_interval_seconds=1
individual_id='00000000-0000-4000-8000-000000000002'
[database]
url_env='ANOTHER_DB_VARIABLE'
[installation]
environment='production'
installation_id='00000000-0000-4000-8000-000000000003'
