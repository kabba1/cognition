services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: cognition
      POSTGRES_USER: cognition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:${COGNITION_POSTGRES_PORT:-55434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
